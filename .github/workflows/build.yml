name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR names must be lowercase (the repo name is not).
  IMAGE: ghcr.io/solidlime/pi-agent-container

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Host-side: unify-pi-install.sh is what keeps the container at one
      # pi-coding-agent, so its logic is exercised here without docker or npm
      # (pure fixture tree, no network).
      - name: test unify-pi-install.sh
        run: sh tests/unify-pi-install-test.sh

      # Plain `docker build`, not buildx: the default daemon keeps the image
      # locally, so the smoke test below runs against what was just built
      # instead of implicitly pulling it back from GHCR (propagation delay →
      # flaky failure). The build is a couple of minutes, so no gha cache.
      - name: build
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT="$(git rev-parse --short HEAD)"
          docker build -t "$IMAGE:latest" -t "$IMAGE:sha-$SHORT" .
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.ref_name }}"
          fi

      # Cheap smoke test: the OS-level pieces must survive the build. The
      # npm globals are installed on first boot, so they are not checked here
      # (that path is verified by hand with a throwaway volume — see README).
      #
      # The pandoc render at the end is not decoration: `command -v` would pass
      # on an image whose LaTeX dependency closure lost a package, and pandoc
      # exits 0 even when xelatex drops every CJK glyph (it only warns), so the
      # exit code alone cannot catch either. The table pulls booktabs/longtable
      # (texlive-latex-recommended, a Depends of texlive-xetex) — that is the
      # part a slimmer apt line would silently break.
      - name: smoke test
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -e
            command -v git chezmoi rg zsh tmux vim fzf python3 make g++ sshd pandoc xelatex unify-pi-install
            test -e /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc
            sh -n /usr/local/bin/docker-entrypoint.sh
            sh -n /usr/local/bin/update
            sh -n /usr/local/bin/unify-pi-install
            test -x /usr/local/bin/unify-pi-install
            # subagents refuse to spawn without this (pi-web's entry point is not
            # inside a pi-coding-agent package), so the ENV must survive the build
            test "$PI_SUBAGENTS_PI_CODING_AGENT_PACKAGE_ROOT" = "/root/.npm-global/lib/node_modules/@earendil-works/pi-coding-agent"
            ls -l /usr/local/bin/pi /usr/local/bin/pi-web
            printf "| a | b |\n|---|---|\n| 1 | 2 |\n\n日本語のグリフ確認\n" > /tmp/smoke.md
            pandoc /tmp/smoke.md -o /tmp/smoke.pdf --pdf-engine=xelatex \
              -V mainfont="Noto Serif CJK JP" -V monofont="Noto Sans Mono CJK JP" 2>/tmp/smoke.log
            test -s /tmp/smoke.pdf
            if grep -q "Missing character" /tmp/smoke.log; then
              echo "FAIL: pandoc rendered but dropped glyphs"; cat /tmp/smoke.log; exit 1
            fi
            echo "smoke test OK"'

      # Pushed only after the smoke test passes.
      - name: push
        run: docker push --all-tags "$IMAGE"
