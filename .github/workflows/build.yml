name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR names must be lowercase (the repo name is not).
  IMAGE: ghcr.io/solidlime/pi-agent-container

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Plain `docker build`, not buildx: the default daemon keeps the image
      # locally, so the smoke test below runs against what was just built
      # instead of implicitly pulling it back from GHCR (propagation delay →
      # flaky failure). The build is a couple of minutes, so no gha cache.
      - name: build
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT="$(git rev-parse --short HEAD)"
          docker build -t "$IMAGE:latest" -t "$IMAGE:sha-$SHORT" .
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.ref_name }}"
          fi

      # Cheap smoke test: the OS-level pieces must survive the build, and the
      # npm install path is exercised at the end ([7]) the way the entrypoint
      # does it: pi-web at @latest first, then the CLI at pi-web's exact pin.
      # Asserting the two versions match is the regression guard for the
      # nested-duplicate bug — two @latest installs leave pi at a different
      # version than pi-web's pin, and extensions then resolve the stale nested
      # copy, breaking child sessions. (The rest of the first-boot path still
      # needs the dotfiles and is verified by hand with a throwaway volume.)
      #
      # The pandoc render at the end is not decoration: `command -v` would pass
      # on an image whose LaTeX dependency closure lost a package, and pandoc
      # exits 0 even when xelatex drops every CJK glyph (it only warns), so the
      # exit code alone cannot catch either. The table pulls booktabs/longtable
      # (texlive-latex-recommended, a Depends of texlive-xetex) — that is the
      # part a slimmer apt line would silently break.
      - name: smoke test
        run: |
          # Which image is actually under test (the tag could be stale/local).
          docker image inspect "$IMAGE:latest" --format 'image {{.Id}} created {{.Created}}'
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -e
            fail=0
            bad() { echo "FAIL: $*"; fail=1; }
            echo "[0] environment"
            echo "  PATH=$PATH"
            ls -ld /usr/local/bin/chezmoi || echo "  /usr/local/bin/chezmoi ABSENT"
            echo "[1] tools"
            for t in git chezmoi rg zsh tmux vim fzf python3 make g++ sshd pandoc xelatex; do
              p="$(command -v "$t" || true)"
              if [ -n "$p" ]; then printf "  %-16s %s\n" "$t" "$p"; else printf "  %-16s MISSING\n" "$t"; fail=1; fi
            done
            echo "[2] CJK fonts"
            test -e /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc || bad "no Noto CJK font file"
            echo "[3] scripts"
            for f in docker-entrypoint.sh update; do sh -n "/usr/local/bin/$f" || bad "$f does not parse"; done
            echo "[4] subagent host-package override"
            echo "  PI_SUBAGENTS_PI_CODING_AGENT_PACKAGE_ROOT=${PI_SUBAGENTS_PI_CODING_AGENT_PACKAGE_ROOT:-<UNSET>}"
            test "$PI_SUBAGENTS_PI_CODING_AGENT_PACKAGE_ROOT" = "/root/.npm-global/lib/node_modules/@earendil-works/pi-coding-agent" || bad "host-package override missing"
            grep -q PI_SUBAGENTS_PI_CODING_AGENT_PACKAGE_ROOT /etc/environment || bad "/etc/environment lacks the override (ssh sessions would miss it)"
            echo "[5] launchers"
            ls -l /usr/local/bin/pi /usr/local/bin/pi-web || bad "pi/pi-web symlinks missing"
            echo "[6] CJK pdf render"
            printf "| a | b |\n|---|---|\n| 1 | 2 |\n\n日本語のグリフ確認\n" > /tmp/smoke.md
            pandoc /tmp/smoke.md -o /tmp/smoke.pdf --pdf-engine=xelatex \
              -V mainfont="Noto Serif CJK JP" -V monofont="Noto Sans Mono CJK JP" 2>/tmp/smoke.log || bad "pandoc failed"
            test -s /tmp/smoke.pdf || bad "no pdf produced"
            if grep -q "Missing character" /tmp/smoke.log; then bad "pandoc dropped CJK glyphs"; cat /tmp/smoke.log; fi
            echo "[7] pi-web pin == pi CLI"
            npm install -g --no-fund --no-audit @agegr/pi-web@latest >/tmp/pi-install.log 2>&1 || { bad "pi-web install failed"; tail -20 /tmp/pi-install.log; }
            NPMROOT=$(npm root -g)
            PIN=$(node -e "const fs=require(\"fs\");const r=process.argv[1];process.stdout.write(JSON.parse(fs.readFileSync(r+\"/@agegr/pi-web/package.json\",\"utf8\")).dependencies[\"@earendil-works/pi-coding-agent\"])" "$NPMROOT")
            npm install -g --no-fund --no-audit "@earendil-works/pi-coding-agent@$PIN" >>/tmp/pi-install.log 2>&1 || { bad "pi CLI install failed"; tail -20 /tmp/pi-install.log; }
            PI_VER=$(pi --version 2>/dev/null) || bad "pi not runnable"
            echo "  pi=$PI_VER pin=$PIN"
            test "$PI_VER" = "$PIN" || bad "pi $PI_VER != pi-web pin $PIN"
            [ "$fail" = 0 ] || { echo "SMOKE TEST FAILED"; exit 1; }
            echo "smoke test OK"'

      # Pushed only after the smoke test passes.
      - name: push
        run: docker push --all-tags "$IMAGE"
