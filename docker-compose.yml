services:
  pi:
    # Built by GitHub Actions (see .github/workflows/build.yml). Pull with
    # `docker compose pull` to move to a new build.
    image: ghcr.io/solidlime/pi-agent-container:latest
    container_name: pi
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Token with read access to the dotfiles repo (private repo → required).
      # Put GH_TOKEN=... in a .env file next to this compose file (gitignored).
      # Leave it unset/empty to boot a stock container (no dotfiles sync) — or
      # unset it *and* mount the host's gh CLI config (volumes below): the
      # entrypoint then uses whatever `gh auth login` stored.
      GH_TOKEN: ${GH_TOKEN:-}
      PI_WEB_ALLOWED_HOSTS: nas
      SHELL: /usr/bin/zsh
      TZ: Asia/Tokyo
      # PI_WEB_PASSWORD: ${PI_WEB_PASSWORD:-}
    volumes:
      # /root holds the npm globals (.npm-global), pi state and extensions
      # (.pi), the chezmoi source (.local/share/chezmoi) and the workspace.
      # One host directory → a recreated container keeps all of it.
      - /volume1/docker/pi/root:/root
    # Uncomment when the container has to reach the host by name:
    extra_hosts:
      - "nas:host-gateway"
